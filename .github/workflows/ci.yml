name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Build only for pushes to main (pull requests are validated by `checks`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build` must not contact real services. Values are inert
      # placeholders — tests and build are hermetic by design.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/ledgerai"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
          ASK_V2_ENABLED: "false"
          NEXT_PUBLIC_APP_URL: "https://example.com"
